modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''

[[dependencies."${mod_id}"]]
modId="neoforge"
mandatory=true
versionRange="${neo_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies."${mod_id}"]]
modId="jade"
mandatory=false
versionRange="[15.10,)"
ordering="AFTER"
side="BOTH"

[[dependencies."${mod_id}"]]
modId="jei"
mandatory=false
versionRange="[19.0,)"
ordering="AFTER"
side="BOTH"

[[mixins]]
config="${mod_id}.mixins.json"