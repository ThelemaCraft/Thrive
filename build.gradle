plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.115'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    srcDir('src/generated/resources')
    exclude("**/*.bbmodel")
    exclude("src/generated/**/.cache")
}

repositories {
    // 本地 libs 文件夹（存放前置模组 jar）
    flatDir { dirs 'libs' }

}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    accessTransformers.from 'src/main/resources/META-INF/accesstransformer.cfg'

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // 第二个客户端，用于多人测试
        client2 {
            client()
            gameDirectory = file('run2')
            programArguments = ["--username", "TestPlayer2"]
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {

    // 请将对应的 jar 文件放入项目根目录的 libs/ 文件夹中

    // Geckolib
    implementation files('libs/geckolib-neoforge-1.21.1-4.9.2.jar')

    // Jade
    compileOnly files('libs/Jade-1.21.1-NeoForge-15.10.6.jar')
    localRuntime files("libs/Jade-1.21.1-NeoForge-15.10.6.jar")


    // JEI + MezzConfig
    compileOnly files("libs/[JEI物品管理器] jei-1.21.1-neoforge-19.21.2.313.jar")
    localRuntime files("libs/[JEI物品管理器] jei-1.21.1-neoforge-19.21.2.313.jar")
    compileOnly files("libs/mezz_config-1.21.1-neoforge-0.6.8-standalone.jar")
    localRuntime files("libs/mezz_config-1.21.1-neoforge-0.6.8-standalone.jar")

    // 其它辅助模组（仅进游戏，不编译引用）
    localRuntime files("libs/playernbt-1.0.0.jar")
    localRuntime files("libs/componentviewer-neoforge-1.3.3+1.21.1.jar")

}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}